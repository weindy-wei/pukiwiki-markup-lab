name: PukiWiki table baseline (offline)
on:
  pull_request:
    paths:
      - "docs/markup/table-basics.md"
      - "tests/markup/**"
      - "plugin/tabletpl.inc.php"
      - "plugin/tabletpl_templates/**"
      - "docs/architecture/table-templates-v1.md"
      - "web/filmwiki/**"
      - "tests/filmwiki_ui.test.mjs"
      - ".github/workflows/table-baseline-check.yml"
  push:
    branches: [master]
    paths:
      - "docs/markup/table-basics.md"
      - "tests/markup/**"
      - "plugin/tabletpl.inc.php"
      - "plugin/tabletpl_templates/**"
      - "docs/architecture/table-templates-v1.md"
      - "web/filmwiki/**"
      - "tests/filmwiki_ui.test.mjs"
      - ".github/workflows/table-baseline-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check FilmWiki read-only view model (Node offline)
        run: node --test tests/filmwiki_ui.test.mjs
      - name: Check Python syntax
        run: python -m compileall -q tests/markup
      - name: Validate five documented cases (offline)
        run: python tests/markup/test_table_rendering.py --dry-run
      - name: Test runner safeguards and assertions (offline)
        run: python -m unittest discover -s tests/markup -p 'test_*.py' -v
      - name: Compile and test table template plugin in PHP 8.1
        run: |
          docker run --rm --network none -v "$PWD:/code:ro" -w /code php:8.1-fpm php -l plugin/tabletpl.inc.php
          docker run --rm --network none -v "$PWD:/code:ro" -w /code php:8.1-fpm php tests/markup/check_tabletpl_compiler.php
          docker run --rm --network none -v "$PWD:/code:ro" -w /code php:8.1-fpm php tests/markup/check_tabletpl_v2.php
